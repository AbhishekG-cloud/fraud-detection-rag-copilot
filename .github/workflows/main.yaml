
name: Credit Card Fraud Detection CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Inference Tests
        run: |
          python -m pytest tests/test_inference.py -v

      - name: Run SHAP Tests
        run: |
          python -m pytest tests/test_shap.py -v

      - name: Run Pipeline Explanation Tests
        run: |
          python -m pytest tests/test_pipeline_explanation.py -v

      - name: Build Docker Image
        run: |
          docker build -t credit-card-fraud:test .
