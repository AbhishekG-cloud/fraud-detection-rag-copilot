
name: Credit Card Fraud Detection CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ECR_REPOSITORY: credit-card-fraud
  IMAGE_TAG: latest

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker Image
        run: |
          docker build -t credit-card-fraud:test .

  deployment:
    name: Continuous Deployment
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag and Push Image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY
          script: |
            set -e

            aws ecr get-login-password --region "$AWS_REGION" | \
              sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"

            sudo docker pull "$ECR_REGISTRY/credit-card-fraud:latest"

            sudo docker rm -f fraud_container 2>/dev/null || true

            sudo docker run -d \
              --name fraud_container \
              --restart unless-stopped \
              -p 8501:8501 \
              "$ECR_REGISTRY/credit-card-fraud:latest"

            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8501/_stcore/health; then
                echo "Deployment successful"
                exit 0
              fi
              sleep 5
            done

            echo "Deployment health check failed"
            sudo docker logs fraud_container
            exit 1
